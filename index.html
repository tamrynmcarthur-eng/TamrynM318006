<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8"/>
        <title>TV search site</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link rel="stylesheet" href="styles.css"/>

    </head>
    <body id="home-page">
        <nav class="bg-gray-100 border-b border-gray-300 py-5 px-6">
            <a class="text-xl font-semibold text-gray-800" href="index.html"> Tam's TV Search Site </a>
            <button class="md:hidden items-center p-2 rounded text-gray-800 hover:bg-blue-200
            ml-auto" onclick="this.nextElementSibling.classList.toggle('hidden')">
            </button>
        </nav>
        <div class="max-w-6xl mx-auto my-12 px-4">
            <form id="search-form" class="grid grid-cols-8 gap-3 items-center bg-white p-4 rounded-xl 
            shadow-md border border-gray-300">
            <select id="search-type" class="col-span-1">
                <option value="show">Shows</option>
                <option value="actor">Actors</option>
            </select>
                <input id="search-input" type="text" placeholder="Search for TV shows or Actors..."
                class="col-span-5 w-full border border-gray-300 rounded-lg px-4 py-3
                text-base focus:outline-none focus:ring-2 focus:ring-blue-500">

                <button type="submit" class="col-span-2 bg-blue-500 text-white px-4 py-3
                text-base font-medium rounded-lg hover:bg-blue-600">Search</button>
                </form>
        </div>
        <div id="popular-shows-container" class="shows-grid"></div>
        <script src="shows.js"></script>
    </body>
</html>
